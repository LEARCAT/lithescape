[package]
name = "lithescape"
version = "0.2.24"
edition = "2021"
description = "LitheScape daily wallpaper tray app for deepin V25"

[dependencies]
tokio = { version = "1", features = ["full"] }
zbus = { version = "4.4", default-features = false, features = ["tokio"] }
zvariant = "4.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.11", default-features = false, features = ["blocking", "rustls-tls", "json"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
